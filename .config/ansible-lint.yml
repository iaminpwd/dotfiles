exclude_paths:
  - ansible/roles/packages/tasks/main.yml
  # ansible-lint는 인자 없이 호출되면(validate_ansible()) 저장소 전체를 스캔한다.
  # 아래 두 경로는 회귀 테스트용으로 일부러 깨뜨려둔 픽스처라, 제외하지 않으면
  # ansible/site.yml 한 줄만 고쳐도 무관한 픽스처 위반으로 커밋이 막힌다
  # (2026-08-04 실측: --all 모드는 물론 staged 모드 실제 커밋에서도 재현됨).
  - contexts/dotfiles/tests/fixtures-ansible/
  - contexts/aws/tests/fixtures-sam/
  - contexts/pre-flight-check/tests/fixtures-yaml/
offline: true
