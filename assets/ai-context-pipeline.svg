<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1630" viewBox="0 0 2400 1630" role="img" aria-labelledby="title desc">
  <title id="title">AI Context and Hook Pipeline</title>
  <desc id="desc">Current dotfiles Ansible context deployment to Gemini, Claude, and Codex, followed by separate PostToolUse edit logging and Stop-based conditional validation flows.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", "Segoe UI", sans-serif; fill:#20314b; }
      .title { font-size:59px; font-weight:700; fill:#0c2245; }
      .subtitle { font-size:25px; fill:#526477; }
      .section { font-size:35px; font-weight:700; }
      .cardtitle { font-size:25px; font-weight:700; fill:#142a4c; }
      .body { font-size:21px; fill:#40516c; }
      .path { font-size:21px; fill:#20314b; }
      .mini { font-size:19px; fill:#566a80; }
      .foot { font-size:23px; font-weight:600; fill:#34465a; }
      .source { fill:#fff; stroke:#8fb8e7; stroke-width:2; }
      .deploy { fill:#fff; stroke:#9ad0ac; stroke-width:2; }
      .agent { fill:#fff; stroke:#8fb8e7; stroke-width:2; }
      .log { fill:#fff; stroke:#ada0e6; stroke-width:2; }
      .stop { fill:#fff; stroke:#efa5af; stroke-width:2; }
      .wire { fill:none; stroke:#627388; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .wire-green { fill:none; stroke:#3d9971; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .wire-purple { fill:none; stroke:#8064bc; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .wire-red { fill:none; stroke:#c65e72; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path fill="#627388" d="M1 1L11 6L1 11Z"/></marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path fill="#3d9971" d="M1 1L11 6L1 11Z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path fill="#8064bc" d="M1 1L11 6L1 11Z"/></marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path fill="#c65e72" d="M1 1L11 6L1 11Z"/></marker>
  </defs>
  <rect width="2400" height="1630" fill="#ffffff"/>
  <text class="title" x="1200" y="78" text-anchor="middle">AI Context &amp; Hook Pipeline</text>
  <text class="subtitle" x="1200" y="125" text-anchor="middle">dotfiles · source-controlled configuration · bootstrap / Ansible · Claude / Antigravity / Codex</text>

  <!-- 1. Sources -->
  <rect x="80" y="180" width="665" height="660" rx="22" fill="#eaf5ff" stroke="#a3d4f4" stroke-width="2"/>
  <text class="section" x="413" y="241" fill="#1b548c" text-anchor="middle">1. SOURCE CONTEXTS</text>
  <rect class="source" x="110" y="285" width="605" height="110" rx="15"/>
  <text class="cardtitle" x="412" y="328" text-anchor="middle">contexts/base.AGENTS.md</text>
  <text class="body" x="412" y="363" text-anchor="middle">One shared global rules file</text>
  <rect class="source" x="110" y="415" width="605" height="110" rx="15"/>
  <text class="cardtitle" x="412" y="458" text-anchor="middle">contexts/dotfiles/SKILL.md</text>
  <text class="body" x="412" y="492" text-anchor="middle">Dotfiles-only, repository-local instructions</text>
  <rect class="source" x="110" y="545" width="605" height="110" rx="15"/>
  <text class="cardtitle" x="412" y="588" text-anchor="middle">contexts/drawio-gen/SKILL.md</text>
  <text class="body" x="412" y="622" text-anchor="middle">Only globally deployed domain skill</text>
  <rect x="110" y="675" width="605" height="132" rx="15" fill="#f7fbff" stroke="#8fb8e7" stroke-width="2" stroke-dasharray="8,8"/>
  <text class="cardtitle" x="412" y="718" text-anchor="middle">Other contexts/* folders</text>
  <text class="body" x="412" y="757" text-anchor="middle">Validation scripts / tests / evaluations retained</text>
  <text class="body" x="412" y="786" text-anchor="middle">Not globally registered as skills</text>
  <!-- Source files are inputs to Ansible; they are not themselves agent runtimes. -->
  <path class="wire-green" d="M747 320H791" marker-end="url(#arrow-green)"/>

  <!-- 2. Deployment -->
  <rect x="773" y="180" width="820" height="660" rx="22" fill="#eafaf1" stroke="#96d3b0" stroke-width="2"/>
  <text class="section" x="1183" y="241" text-anchor="middle" fill="#196246">2. INSTALL &amp; SYMLINKS</text>
  <rect class="deploy" x="800" y="282" width="217" height="76" rx="13"/>
  <rect class="deploy" x="1067" y="282" width="217" height="76" rx="13"/>
  <rect class="deploy" x="1334" y="282" width="229" height="76" rx="13"/>
  <text class="cardtitle" x="909" y="328" text-anchor="middle">bootstrap.sh</text>
  <text class="cardtitle" x="1175" y="328" text-anchor="middle">Justfile</text>
  <text class="cardtitle" x="1448" y="316" text-anchor="middle">Ansible</text>
  <text class="body" x="1448" y="343" text-anchor="middle">ai_agent role</text>
  <path class="wire-green" d="M1019 320H1059" marker-end="url(#arrow-green)"/>
  <path class="wire-green" d="M1286 320H1326" marker-end="url(#arrow-green)"/>
  <!-- Ansible fans out through one orthogonal bus, with one arrow per deployed target. -->
  <path class="wire-green" d="M1448 361V408H910"/>
  <path class="wire-green" d="M910 408V433" marker-end="url(#arrow-green)"/>
  <path class="wire-green" d="M1178 408V433" marker-end="url(#arrow-green)"/>
  <path class="wire-green" d="M1448 408V433" marker-end="url(#arrow-green)"/>
  <rect x="790" y="440" width="254" height="364" rx="14" fill="#fff" stroke="#9acaf1" stroke-width="2"/>
  <text class="cardtitle" x="917" y="480" text-anchor="middle" fill="#1b548c">GLOBAL RULES</text>
  <text class="mini" x="917" y="520" text-anchor="middle">base.AGENTS.md</text>
  <text class="path" x="917" y="567" text-anchor="middle">~/.gemini/config/</text>
  <text class="path" x="917" y="595" text-anchor="middle">AGENTS.md</text>
  <text class="path" x="917" y="657" text-anchor="middle">~/.claude/</text>
  <text class="path" x="917" y="686" text-anchor="middle">CLAUDE.md</text>
  <text class="path" x="917" y="747" text-anchor="middle">~/.codex/AGENTS.md</text>
  <rect x="1057" y="440" width="254" height="364" rx="14" fill="#fff" stroke="#bea9eb" stroke-width="2"/>
  <text class="cardtitle" x="1184" y="480" text-anchor="middle" fill="#5c378a">REPO LOCAL</text>
  <text class="mini" x="1184" y="520" text-anchor="middle">dotfiles/SKILL.md</text>
  <text class="path" x="1184" y="582" text-anchor="middle">&lt;repo&gt;/AGENTS.md</text>
  <text class="path" x="1184" y="646" text-anchor="middle">&lt;repo&gt;/CLAUDE.md</text>
  <text class="mini" x="1184" y="715" text-anchor="middle">Links exist only</text>
  <text class="mini" x="1184" y="744" text-anchor="middle">inside dotfiles repo</text>
  <rect x="1324" y="440" width="254" height="364" rx="14" fill="#fff" stroke="#ebc48e" stroke-width="2"/>
  <text class="cardtitle" x="1451" y="480" text-anchor="middle" fill="#965a26">DRAWIO SKILL</text>
  <text class="mini" x="1451" y="521" text-anchor="middle">drawio-gen/</text>
  <text class="path" x="1451" y="575" text-anchor="middle">~/.gemini/config/</text>
  <text class="path" x="1451" y="604" text-anchor="middle">skills/</text>
  <text class="path" x="1451" y="661" text-anchor="middle">~/.claude/skills/</text>
  <text class="path" x="1451" y="719" text-anchor="middle">~/.agents/skills/</text>
  <text class="mini" x="1451" y="777" text-anchor="middle">Assets linked; tests stay</text>
  <path class="wire-green" d="M1565 320H1615" marker-end="url(#arrow-green)"/>

  <!-- 3. Consumers -->
  <rect x="1621" y="180" width="699" height="660" rx="22" fill="#eaf5ff" stroke="#a3d4f4" stroke-width="2"/>
  <text class="section" x="1970" y="241" text-anchor="middle">3. AGENT USE</text>
  <rect class="agent" x="1656" y="300" width="629" height="142" rx="15"/>
  <text class="cardtitle" x="1970" y="351" text-anchor="middle">CLAUDE CODE</text>
  <text class="body" x="1970" y="388" text-anchor="middle">Global + dotfiles-local rules + drawio-gen</text>
  <rect class="agent" x="1656" y="477" width="629" height="142" rx="15"/>
  <text class="cardtitle" x="1970" y="528" text-anchor="middle">ANTIGRAVITY</text>
  <text class="body" x="1970" y="565" text-anchor="middle">Global + dotfiles-local rules + drawio-gen</text>
  <rect class="agent" x="1656" y="654" width="629" height="142" rx="15"/>
  <text class="cardtitle" x="1970" y="705" text-anchor="middle">CODEX</text>
  <text class="body" x="1970" y="742" text-anchor="middle">Global + dotfiles-local rules + drawio-gen</text>

  <!-- Agent events fan-out; PostToolUse only for Claude/Antigravity -->
  <!-- Event branches are centered over their downstream panels. -->
  <path class="wire" d="M1970 842V883H620"/>
  <path class="wire" d="M620 883V912" marker-end="url(#arrow)"/>
  <path class="wire" d="M1757 883V912" marker-end="url(#arrow)"/>

  <!-- 4A. Edit history -->
  <rect x="80" y="918" width="1080" height="584" rx="22" fill="#f4f0ff" stroke="#b4a4e9" stroke-width="2"/>
  <text class="section" x="620" y="973" text-anchor="middle" fill="#594097">4A. PostToolUse — EDIT HISTORY</text>
  <text class="body" x="620" y="1015" text-anchor="middle">Claude + Antigravity, matched tools only; best-effort logging</text>
  <rect class="log" x="249" y="1058" width="742" height="98" rx="14"/>
  <text class="cardtitle" x="620" y="1096" text-anchor="middle">PostToolUse event</text>
  <text class="body" x="620" y="1128" text-anchor="middle">Supported file write / edit operation</text>
  <path class="wire-purple" d="M620 1159V1200" marker-end="url(#arrow-purple)"/>
  <rect class="log" x="249" y="1206" width="742" height="103" rx="14"/>
  <text class="cardtitle" x="620" y="1250" text-anchor="middle">bin/hooks/agent-edits-hook.sh</text>
  <text class="body" x="620" y="1283" text-anchor="middle">Record timestamp, path, tool and result</text>
  <path class="wire-purple" d="M620 1312V1351" marker-end="url(#arrow-purple)"/>
  <rect class="log" x="249" y="1357" width="742" height="113" rx="14"/>
  <text class="cardtitle" x="620" y="1400" text-anchor="middle">&lt;repo&gt;/.agent-state/edits.log</text>
  <text class="body" x="620" y="1435" text-anchor="middle">Path / tool / result or error text · global Git-ignore</text>

  <!-- 4B. Conditional preflight -->
  <rect x="1194" y="918" width="1126" height="584" rx="22" fill="#fff1f2" stroke="#efa5af" stroke-width="2"/>
  <text class="section" x="1757" y="973" text-anchor="middle" fill="#92374b">4B. Stop — CONDITIONAL VERIFICATION</text>
  <text class="body" x="1757" y="1015" text-anchor="middle">Installed Stop hooks; Codex requires explicit /hooks trust</text>
  <rect class="stop" x="1236" y="1041" width="461" height="78" rx="13"/>
  <rect class="stop" x="1732" y="1041" width="544" height="78" rx="13"/>
  <text class="cardtitle" x="1467" y="1087" text-anchor="middle">Claude → native Stop gate</text>
  <text class="cardtitle" x="2004" y="1073" text-anchor="middle">Antigravity / Codex</text>
  <text class="mini" x="2004" y="1100" text-anchor="middle">agent-stop-adapter.sh</text>
  <!-- Each Stop route joins a shared collector before one centered gate arrow. -->
  <path class="wire-red" d="M1467 1122V1148H1757"/>
  <path class="wire-red" d="M2004 1122V1148H1757"/>
  <path class="wire-red" d="M1757 1148V1165" marker-end="url(#arrow-red)"/>
  <rect class="stop" x="1337" y="1170" width="840" height="74" rx="13"/>
  <text class="cardtitle" x="1757" y="1215" text-anchor="middle">bin/hooks/pre-flight-gate-hook.sh</text>
  <path class="wire-red" d="M1757 1247V1262" marker-end="url(#arrow-red)"/>
  <rect class="stop" x="1337" y="1268" width="840" height="84" rx="13"/>
  <text class="cardtitle" x="1757" y="1302" text-anchor="middle">Changed files?  Success cache hit?</text>
  <text class="body" x="1757" y="1332" text-anchor="middle">Skip unchanged / already-verified state</text>
  <path class="wire-red" d="M1757 1355V1370" marker-end="url(#arrow-red)"/>
  <rect class="stop" x="1337" y="1377" width="840" height="96" rx="13"/>
  <text class="cardtitle" x="1757" y="1417" text-anchor="middle">PFC_PROFILE=stop · --changed</text>
  <text class="mini" x="1757" y="1451" text-anchor="middle">Prompt lint / test registration / targeted regressions (dotfiles)</text>

  <rect x="80" y="1530" width="2240" height="72" rx="14" fill="#eef2f7" stroke="#d7e0eb" stroke-width="2"/>
  <text class="foot" x="1200" y="1560" text-anchor="middle">No per-edit validation. Stop skips clean/unsupported repos or cached state; applies only when a hook actually runs.</text>
  <text class="mini" x="1200" y="1589" text-anchor="middle">Detected failure: Claude/Codex block, Antigravity requests continuation if possible. Git pre-commit / CI are separate checks.</text>
</svg>
