# 010-k8s-core.md 4절 중단 조건 재현: "securityContext 의 privileged: true 가
# 확인되면 즉시 작업 중단(Hard Block)". ok-baseline.yaml 에서 이 한 가지만
# 바꾼 변형이며, kube-linter privileged-container 체크가 실제로 잡아야 한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ok-baseline
  namespace: sample
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ok-baseline
  namespace: sample
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ok-baseline
  template:
    metadata:
      labels:
        app: ok-baseline
    spec:
      # 010 2.1 Least Privilege: 워크로드 SA 는 API 토큰 자동 마운트 비활성
      automountServiceAccountToken: false
      serviceAccountName: ok-baseline
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # 010 2.2 High Availability Scheduling
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ok-baseline
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: ok-baseline
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
          # 010 2.2 QoS: Memory 는 Limit=Request 로 OOM 리스크 통제,
          # CPU 는 Throttling 방지를 위해 Limit 을 Request 보다 넉넉히
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
