name: Nightly Code & Prompt Review

on:
  schedule:
    - cron: '0 18 * * *' # KST 03:00 (UTC 18:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # 무료 티어 한도. TPM(250k)은 호출 간격으로 흡수되므로 RPD 가 실질 병목이다.
      # 검증 스텝과 실행 스텝이 같은 값을 봐야 하므로 잡 레벨에 한 번만 선언한다.
      GEMINI_MAX_DAILY_REQUESTS: "20"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      # 검증기가 깨지면 코퍼스 린트는 통과해도 파이프라인이 무력해진다. 외부 도구가
      # 거의 필요 없는 세 스위트만 CI 에서 돌린다. terraform/checkov 계열이 필요한
      # 나머지 스위트는 설치 비용이 커서 로컬 pre-commit 훅에 맡긴다.
      - name: Install Suite Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stow zsh

      - name: Validator Regression Suites
        run: |
          for suite in dotfiles agent-handoff drawio-gen; do
            echo "::group::$suite"
            bash "contexts/$suite/tests/run.sh"
            echo "::endgroup::"
          done

      # 링크/코드펜스/SSOT 무결성은 결정론적 검사가 정확하고 무료다.
      # LLM 패스로 중복 검사하지 않으며, 여기서 실패하면 API 호출 없이 조기 종료한다.
      - name: Prompt Corpus Lint
        run: |
          bash contexts/dotfiles/scripts/prompt-lint.sh

      # 계획 단계에서 확정되는 성질(버킷 1회전, 패스 로테이션, RPD/TPM 예산)은 API 없이
      # 검증한다. 룰북 증설로 예산을 넘기는 변경이 들어와도 토큰을 태우기 전에 실패한다.
      - name: Review Plan Eval
        run: |
          python3 contexts/dotfiles/scripts/eval_review_plan.py

      - name: Run Gemini Nightly Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.6-flash"
          GEMINI_CALL_INTERVAL: "90"
        run: |
          python3 -u contexts/dotfiles/scripts/gemini_review.py

      - name: Commit and Push Review Report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update nightly gemini review report [skip ci]"
          file_pattern: "reviews/*.md"
          skip_dirty_check: false
