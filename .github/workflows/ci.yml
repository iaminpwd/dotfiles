name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 외부 자원(Oh My Zsh, mise 릴리스 등) 드리프트 감지용 — 매주 일요일 bootstrap-smoke만 재실행
    # (verify는 코드 불변 시 결과도 동일해 스케줄 불필요 — 아래 verify job의 if 조건 참고).
    - cron: "0 0 * * 0"
  # Actions 탭에서 "Run workflow" 버튼으로 스케줄을 안 기다리고 바로 돌려볼 수 있게 함.
  workflow_dispatch:

# 같은 브랜치에 연달아 push할 때 이전 실행을 취소해 Actions 시간을 절약.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 기본 GITHUB_TOKEN을 읽기 전용으로 최소권한화 (이 워크플로는 어떤 것도 쓰지 않음).
permissions:
  contents: read

jobs:
  bootstrap-changes:
    name: Detect bootstrap changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: bash .github/scripts/bootstrap-changes.sh >> "$GITHUB_OUTPUT"

  # 로컬 git hook은 --no-verify로 우회 가능하므로, 이 job이 실제 우회 불가능한 검증 게이트 역할을 한다.
  verify:
    name: Lint & Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 스케줄 실행은 외부 드리프트 감지가 목적이라 bootstrap-smoke만 필요 (위 on.schedule 주석 참고).
    if: github.event_name != 'schedule'
    # mise가 GitHub Releases에서 도구를 받을 때 걸리는 익명 API 요청 제한(60/시간) 회피용 —
    # GITHUB_TOKEN을 넘겨 인증 요청(5000/시간)으로 바꾼다.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # persist-credentials: false — 켜두면 just verify가 도는 trufflehog가 .git/config의
      # 임시 인증 토큰을 유출 시크릿으로 오탐한다. 이후 push/fetch 없어 꺼도 안전.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # 아래 커밋 메시지 게이트가 base..head 범위를 조회하려면 전체 히스토리 필요(기본 depth=1이면 실패).
          fetch-depth: 0

      # --no-verify로 우회된 커밋 컨벤션 위반이 main까지 들어오지 않도록 재검증(.github/scripts/lint-commit-messages.sh).
      - name: Lint commit messages (semantic convention gate)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          # force-push 로 히스토리가 재작성되면 BEFORE_SHA 가 저장소에서 사라져 범위 계산이
          # 불가능해진다. 그때 쓸 폴백으로 이번 푸시에 포함된 커밋 id 목록을 넘긴다.
          PUSHED_SHAS: ${{ join(github.event.commits.*.id, ' ') }}
        run: bash .github/scripts/lint-commit-messages.sh

      # bootstrap.sh 와 같은 스크립트를 쓴다. 예전엔 여기만 `curl -fsSL https://mise.run | sh`
      # 라, 같은 저장소가 두 가지 신뢰 수준으로 mise 를 들이고 있었다 — 그리고 CI 는 검증
      # 없이 받은 그 mise 로 저장소의 검증 스위트 전체를 돌렸다.
      - name: Install mise (GPG-verified, same path as bootstrap.sh)
        run: |
          bash bin/utils/install-mise.sh
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache mise-managed tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/mise
          key: mise-verify-${{ runner.os }}-${{ hashFiles('stow/mise/.config/mise/config.toml', '.github/scripts/ci-tool-config.py') }}

      # 버전 정본에서 검증에 필요한 도구만 추출한다. bootstrap-smoke는 전체 설치를 유지한다.
      - name: Generate verification tool config
        run: |
          mkdir -p ~/.config/mise
          /usr/bin/python3 .github/scripts/ci-tool-config.py > ~/.config/mise/config.toml

      - name: Install pinned tools (shellcheck, tflint, checkov, trufflehog, ansible-lint ...)
        run: |
          mise install uv
          mise install

      - name: Scan PR/push commit range for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          CURRENT_SHA: ${{ github.sha }}
        run: bash .github/scripts/secret-history-scan.sh

      - name: Install zsh and GNU Stow (required by shell and ignore regression)
        run: |
          # Hosted runners already carry apt package indexes. Use them first to
          # avoid an unnecessary network-bound update on every Verify run.
          # If the pinned base image is stale, refresh indexes and retry.
          APT_OPTS=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          if ! sudo apt-get "${APT_OPTS[@]}" install -y zsh stow; then
            sudo apt-get "${APT_OPTS[@]}" update -qq
            sudo apt-get "${APT_OPTS[@]}" install -y zsh stow
          fi
          zsh --version
          stow --version

      # test-zshrc-activation.sh 는 실제 .zshrc가 source하는 Oh My Zsh까지 로드한 상태에서
      # 중첩 zsh의 mise/fzf 훅을 검증한다. 별도 버전 정본을 만들지 않고 zsh role의 고정 SHA를
      # 읽어 같은 revision을 준비한다.
      - name: Prepare pinned Oh My Zsh for zsh activation regression
        run: |
          OMZ_SHA=$(awk '
            /repo: .https:\/\/github.com\/ohmyzsh\/ohmyzsh\.git./ { found = 1; next }
            found && /version:/ { print $2; exit }
          ' ansible/roles/zsh/tasks/main.yml)
          if [[ ! "$OMZ_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pinned Oh My Zsh SHA from ansible role: $OMZ_SHA" >&2
            exit 1
          fi
          git init -q "$HOME/.oh-my-zsh"
          git -C "$HOME/.oh-my-zsh" remote add origin https://github.com/ohmyzsh/ohmyzsh.git
          git -C "$HOME/.oh-my-zsh" fetch --depth 1 origin "$OMZ_SHA"
          git -C "$HOME/.oh-my-zsh" checkout -q --detach FETCH_HEAD

      - name: Run full regression verification (check + test + prompt-lint)
        run: |
          # Profile only the existing dotfiles test runner, without changing test
          # order or passing criteria. Preserve the original failure exit code.
          export DOTFILES_SUITE_TIMING_LOG="$RUNNER_TEMP/dotfiles-test-timings.tsv"
          result=0
          # All domain policy validators are opt-in in the local preflight.
          # CI must enable them or just verify remains green while actual
          # Terraform/Helm/K8s/conftest/delegated checks are never invoked.
          # Route the flag only to the top-level preflight inside run-suite.
          # Domain fixtures run in independent contexts; inheriting the flag
          # in all test runners could change their isolated test contracts.
          RUN_SUITE_PFC_DOMAIN_CHECKS=1 PFC_PROFILE=full just verify || result=$?
          if [ -f "$DOTFILES_SUITE_TIMING_LOG" ]; then
            echo "=== dotfiles test durations (seconds, slowest first) ==="
            sort -t "$(printf '\t')" -k2,2nr "$DOTFILES_SUITE_TIMING_LOG"
          else
            echo "[WARNING] Dotfiles timing report was not produced."
          fi
          exit "$result"

  # bootstrap.sh가 지원 OS에서 끝까지 동작하고 재실행해도 안전한지(멱등성) 검증.
  # RHEL(dnf)은 네이티브 러너가 없고, 컨테이너로 대체하면 ansible docker 롤의 systemd 요구를
  # 못 채워 무관한 이유로 실패하므로 이번 범위에서 제외한다.
  bootstrap-smoke:
    needs: bootstrap-changes
    if: needs.bootstrap-changes.outputs.run == 'true'
    name: Bootstrap Smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # verify job과 동일한 이유(mise github: 백엔드 rate limit 회피)로 GITHUB_TOKEN을 넘긴다.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # persist-credentials: false — 켜두면 bootstrap.sh의 trufflehog filesystem 스캔이
      # .git/config의 임시 토큰을 유출 시크릿으로 오탐해 Hard Block으로 실패한다(실측 버그).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # macos-latest 기본 tap인 aws/tap(미사용, untrusted)이 이후 모든 brew 호출마다 경고를 띄운다.
      # 신뢰 범위를 넓히는 대신 안 쓰는 tap 자체를 제거해 경고를 없앤다.
      - name: Untap unused pre-installed Homebrew tap (aws/tap)
        if: runner.os == 'macOS'
        run: brew untap aws/tap || true

      - name: Bootstrap (1st run)
        run: ./bootstrap.sh < /dev/null

      # exit code만으론 "안 죽었다"만 증명되므로, README 성공 기준(도구/symlink/AI 룰 주입)을 별도 확인.
      # 1st/2nd run 양쪽에서 동일 검증을 호출하므로 스크립트로 SSOT화(.github/scripts/verify-bootstrap-env.sh).
      - name: Verify environment matches README's success criteria (after 1st run)
        run: bash .github/scripts/verify-bootstrap-env.sh

      - name: Bootstrap (2nd run - idempotency check)
        run: |
          set -o pipefail
          SECOND_BOOTSTRAP_LOG="$RUNNER_TEMP/bootstrap-second.log"
          ./bootstrap.sh < /dev/null | tee "$SECOND_BOOTSTRAP_LOG"
          bash .github/scripts/assert-idempotent-ansible-recap.sh "$SECOND_BOOTSTRAP_LOG"

      - name: Verify environment matches README's success criteria (after 2nd run)
        run: bash .github/scripts/verify-bootstrap-env.sh

      # Run only after bootstrap installed GNU Stow + Ansible. Deliberately
      # inject EIO on the second real symlink syscall in a disposable HOME.
      - name: Verify real GNU Stow I/O failure recovery
        env:
          STOW_REQUIRE_REAL: '1'
        run: |
          # bootstrap.sh exports mise shims only in its own process; a new
          # GitHub Actions step starts with a fresh PATH (notably on macOS).
          export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
          bash contexts/dotfiles/tests/test-stow-backup.sh
          bash contexts/dotfiles/tests/test-stow-real-failure.sh
          bash contexts/dotfiles/tests/test-stow-real-unlink.sh
          bash contexts/dotfiles/tests/test-stow-ignore.sh
          bash contexts/dotfiles/tests/test-stow-toctou.sh
