name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 코드 변경이 없어도 bootstrap.sh가 참조하는 외부 자원(Oh My Zsh/Docker 공식 저장소,
    # mise가 조회하는 GitHub 릴리즈 등)이 바뀌어 조용히 깨질 수 있다. 매주 일요일 00:00 UTC에
    # bootstrap-smoke만 재실행해 이런 드리프트를 잡는다 (verify는 코드가 그대로면 결과도
    # 항상 같아서 스케줄로 다시 돌 이유가 없음 — 아래 verify job의 if 조건 참고).
    - cron: "0 0 * * 0"
  # Actions 탭에서 "Run workflow" 버튼으로 스케줄을 안 기다리고 바로 돌려볼 수 있게 함.
  workflow_dispatch:

# 같은 브랜치에 연달아 push할 때 이전 실행을 취소해 Actions 시간을 절약.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 기본 GITHUB_TOKEN을 읽기 전용으로 최소권한화 (이 워크플로는 어떤 것도 쓰지 않음).
permissions:
  contents: read

jobs:
  # 로컬 git hook은 --no-verify로 우회 가능하므로, 이 job이 실제 우회 불가능한 검증 게이트 역할을 한다.
  verify:
    name: Lint & Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 스케줄 실행은 외부 드리프트 감지가 목적이라 bootstrap-smoke만 필요 (위 on.schedule 주석 참고).
    if: github.event_name != 'schedule'
    # mise의 github: 백엔드(bicep 등)가 GitHub API로 릴리즈를 조회하는데, 인증 없이 부르면
    # Actions 러너 공유 IP가 익명 요청 제한(60/시간)에 바로 걸린다. Actions가 잡마다 자동
    # 발급하는 GITHUB_TOKEN을 넘겨 인증 요청(5000/시간)으로 바꿔 회피한다.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # persist-credentials: false — 기본값(true)이면 checkout이 .git/config에 임시 인증
      # 토큰을 기록하는데, just verify가 도는 trufflehog가 이를 유출된 시크릿으로 오탐할 수 있다.
      # 이 job은 이후 git push/fetch가 필요 없으므로 꺼도 안전하다.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache mise-managed tools
        uses: actions/cache@v6
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('mise/.config/mise/config.toml') }}

      # stow가 하는 mise 설정 배치를 그대로 재현 (전체 ansible 프로비저닝은 이 job에서 불필요)
      - name: Apply repo mise tool config
        run: |
          mkdir -p ~/.config/mise
          cp mise/.config/mise/config.toml ~/.config/mise/config.toml

      - name: Install pinned tools (shellcheck, tflint, checkov, trufflehog, ansible-lint ...)
        run: mise install

      # 테스트 스위트가 zsh(-n 문법 검사)와, ai_agent 롤이 평소 ~/.local/bin에 심볼릭 링크해주는
      # bin/**/*.sh(prompt-lint.sh 등)를 전제하므로, 이 job에서도 최소한으로 재현해준다.
      - name: Install zsh (required by test-shell zsh -n subtest)
        run: sudo apt-get update -qq && sudo apt-get install -y zsh

      - name: Symlink agent scripts into ~/.local/bin (mirrors ansible ai_agent role)
        run: |
          mkdir -p ~/.local/bin
          find ./bin ./contexts -type f -name '*.sh' \( -path '*/bin/*' -o -path '*/scripts/*' \) -perm -u+x \
            -exec ln -sf "$(pwd)/{}" ~/.local/bin/ \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full regression verification (check + test + prompt-lint)
        run: just verify

  # bootstrap.sh가 실제로 지원 OS에서 처음부터 끝까지 동작하는지 + 재실행해도 안전한지(멱등성) 검증.
  # RHEL 계열(dnf)은 GitHub Actions에 네이티브 VM 러너가 없고, 컨테이너로 대체하면 ansible의
  # docker 역할이 요구하는 systemd가 없어 무관한 이유로 실패하므로 이번 범위에서 제외한다.
  bootstrap-smoke:
    name: Bootstrap Smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # verify job과 동일한 이유(mise github: 백엔드 rate limit 회피)로 GITHUB_TOKEN을 넘긴다.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # persist-credentials: false — 켜져 있으면 checkout이 .git/config에 임시 인증 토큰을
      # 남기는데, bootstrap.sh가 저장소 전체를 trufflehog filesystem으로 스캔하다가
      # 그 토큰 자체를 유출된 시크릿으로 오탐해 Hard Block으로 실패한다(실측 버그).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bootstrap (1st run)
        run: ./bootstrap.sh < /dev/null

      # exit code만으로는 "안 죽었다"만 증명될 뿐, README의 성공 검증 커맨드가 약속하는
      # 실제 환경 상태(도구 설치, stow 심볼릭 링크, AI 룰/스킬 주입)는 별도로 확인해야 함.
      - name: Verify environment matches README's success criteria (after 1st run)
        run: |
          export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"

          # mise 도구 설치 확인
          mise which shellcheck >/dev/null

          # Stow symlink 확인
          test -L "$HOME/.zshrc"
          test -L "$HOME/.gitconfig"
          test -L "$HOME/.vimrc"
          test -L "$HOME/.tflint.hcl"
          test -L "$HOME/.config/mise/config.toml"

          # AI 글로벌 룰 주입 확인 (Gemini/Claude)
          test -L "$HOME/.gemini/config/AGENTS.md"
          test -L "$HOME/.claude/CLAUDE.md"
          [ -s "$HOME/.gemini/config/AGENTS.md" ]

          # 스킬 레지스트리 등록 확인
          [ -n "$(ls -A "$HOME/.gemini/config/skills/" 2>/dev/null)" ]
          [ -n "$(ls -A "$HOME/.claude/skills/" 2>/dev/null)" ]

      - name: Bootstrap (2nd run - idempotency check)
        run: ./bootstrap.sh < /dev/null

      - name: Verify environment matches README's success criteria (after 2nd run)
        run: |
          export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"

          mise which shellcheck >/dev/null
          test -L "$HOME/.zshrc"
          test -L "$HOME/.gitconfig"
          test -L "$HOME/.vimrc"
          test -L "$HOME/.tflint.hcl"
          test -L "$HOME/.config/mise/config.toml"
          test -L "$HOME/.gemini/config/AGENTS.md"
          test -L "$HOME/.claude/CLAUDE.md"
          [ -s "$HOME/.gemini/config/AGENTS.md" ]
          [ -n "$(ls -A "$HOME/.gemini/config/skills/" 2>/dev/null)" ]
          [ -n "$(ls -A "$HOME/.claude/skills/" 2>/dev/null)" ]
