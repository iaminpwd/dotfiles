name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 외부 자원(Oh My Zsh, mise 릴리스 등) 드리프트 감지용 — 매주 일요일 bootstrap-smoke만 재실행
    # (verify는 코드 불변 시 결과도 동일해 스케줄 불필요 — 아래 verify job의 if 조건 참고).
    - cron: "0 0 * * 0"
  # Actions 탭에서 "Run workflow" 버튼으로 스케줄을 안 기다리고 바로 돌려볼 수 있게 함.
  workflow_dispatch:

# 같은 브랜치에 연달아 push할 때 이전 실행을 취소해 Actions 시간을 절약.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 기본 GITHUB_TOKEN을 읽기 전용으로 최소권한화 (이 워크플로는 어떤 것도 쓰지 않음).
permissions:
  contents: read

jobs:
  # 로컬 git hook은 --no-verify로 우회 가능하므로, 이 job이 실제 우회 불가능한 검증 게이트 역할을 한다.
  verify:
    name: Lint & Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 스케줄 실행은 외부 드리프트 감지가 목적이라 bootstrap-smoke만 필요 (위 on.schedule 주석 참고).
    if: github.event_name != 'schedule'
    # mise github: 백엔드(bicep 등)의 익명 API 요청 제한(60/시간) 회피용 —
    # GITHUB_TOKEN을 넘겨 인증 요청(5000/시간)으로 바꾼다.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # persist-credentials: false — 켜두면 just verify가 도는 trufflehog가 .git/config의
      # 임시 인증 토큰을 유출 시크릿으로 오탐한다. 이후 push/fetch 없어 꺼도 안전.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # 아래 커밋 메시지 게이트가 base..head 범위를 조회하려면 전체 히스토리 필요(기본 depth=1이면 실패).
          fetch-depth: 0

      # --no-verify로 우회된 커밋 컨벤션 위반이 main까지 들어오지 않도록 재검증(.github/scripts/lint-commit-messages.sh).
      - name: Lint commit messages (semantic convention gate)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: bash .github/scripts/lint-commit-messages.sh

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache mise-managed tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('stow/mise/.config/mise/config.toml') }}

      # stow가 하는 mise 설정 배치를 그대로 재현 (전체 ansible 프로비저닝은 이 job에서 불필요)
      - name: Apply repo mise tool config
        run: |
          mkdir -p ~/.config/mise
          cp stow/mise/.config/mise/config.toml ~/.config/mise/config.toml

      - name: Install pinned tools (shellcheck, tflint, checkov, trufflehog, ansible-lint ...)
        run: mise install

      # 테스트 스위트가 zsh -n 검사와 ai_agent 롤의 ~/.local/bin 심볼릭 링크(prompt-lint.sh 등)를
      # 전제하므로 이 job에서도 최소한으로 재현한다.
      - name: Install zsh (required by test-shell zsh -n subtest)
        run: sudo apt-get update -qq && sudo apt-get install -y zsh

      - name: Symlink agent scripts into ~/.local/bin (mirrors ansible ai_agent role)
        run: |
          mkdir -p ~/.local/bin
          find ./bin ./contexts -type f -name '*.sh' \( -path '*/bin/*' -o -path '*/scripts/*' \) -perm -u+x \
            -exec ln -sf "$(pwd)/{}" ~/.local/bin/ \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full regression verification (check + test + prompt-lint)
        run: just verify

  # bootstrap.sh가 지원 OS에서 끝까지 동작하고 재실행해도 안전한지(멱등성) 검증.
  # RHEL(dnf)은 네이티브 러너가 없고, 컨테이너로 대체하면 ansible docker 롤의 systemd 요구를
  # 못 채워 무관한 이유로 실패하므로 이번 범위에서 제외한다.
  bootstrap-smoke:
    name: Bootstrap Smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # verify job과 동일한 이유(mise github: 백엔드 rate limit 회피)로 GITHUB_TOKEN을 넘긴다.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # persist-credentials: false — 켜두면 bootstrap.sh의 trufflehog filesystem 스캔이
      # .git/config의 임시 토큰을 유출 시크릿으로 오탐해 Hard Block으로 실패한다(실측 버그).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # macos-latest 기본 tap인 aws/tap(미사용, untrusted)이 이후 모든 brew 호출마다 경고를 띄운다.
      # 신뢰 범위를 넓히는 대신 안 쓰는 tap 자체를 제거해 경고를 없앤다.
      - name: Untap unused pre-installed Homebrew tap (aws/tap)
        if: runner.os == 'macOS'
        run: brew untap aws/tap || true

      - name: Bootstrap (1st run)
        run: ./bootstrap.sh < /dev/null

      # exit code만으론 "안 죽었다"만 증명되므로, README 성공 기준(도구/symlink/AI 룰 주입)을 별도 확인.
      # 1st/2nd run 양쪽에서 동일 검증을 호출하므로 스크립트로 SSOT화(.github/scripts/verify-bootstrap-env.sh).
      - name: Verify environment matches README's success criteria (after 1st run)
        run: bash .github/scripts/verify-bootstrap-env.sh

      - name: Bootstrap (2nd run - idempotency check)
        run: ./bootstrap.sh < /dev/null

      - name: Verify environment matches README's success criteria (after 2nd run)
        run: bash .github/scripts/verify-bootstrap-env.sh
