[tools]
# Security & Policy Validation
trivy = "0.71.0"
conftest = "0.68.2"
cosign = "3.1.1"
trufflehog = "3.95.6"
shellcheck = "0.11.0"
shfmt = "3.13.1"
"pipx:checkov" = "3.3.1"
"pipx:yamllint" = "1.38.0"

# Container Image Supply Chain (SBOM/Vuln/Layer Analysis)
syft = "1.48.0"
grype = "0.116.0"
dive = "0.13.1"

# Observability
loki-logcli = "3.7.3"


# IaC & Configuration Management
terraform = "1.5.7"
ansible = "9.5.1"
"pipx:ansible-lint" = "26.4.0"
terragrunt = "1.0.8"
tflint = "0.63.1"
infracost = "0.10.44"
terraform-docs = "0.24.0"

# Cloud Services
awscli = "2.15.30"
azure-cli = "2.87.0"
"pipx:aws-sam-cli" = "1.162.1"
# aqua:Azure/bicep는 musl 바이너리를 받아와 Ubuntu(glibc)에서 실행이 깨지므로 github: 백엔드로 고정.
#
# 이 핀은 순전히 Linux 사정 때문에 고른 것이라, macOS 에서 github: 백엔드가 올바른 자산
# (bicep-osx-arm64)을 집는지는 검증되지 않았다. macOS 에서 bicep 실행이 깨지면 추적 대상인
# 이 파일을 고치지 말고 로컬 오버라이드를 두십시오. mise 는 conf.d 를 나중에 읽어 이 파일의
# 선언을 덮어씁니다(2026-07-28 실측: conf.d 의 jq 1.8.1 이 config.toml 의 1.7.1 을 이김).
#   mkdir -p ~/.config/mise/conf.d
#   printf '[tools]\n"aqua:Azure/bicep" = "0.45.15"\n' > ~/.config/mise/conf.d/macos.toml
"github:Azure/bicep" = "0.45.15"

# Kubernetes & Containers
kubectl = "1.30.1"
kubectx = "0.9.5"
k9s = "0.32.4"
helm = "4.2.1"
kustomize = "5.8.1"
kube-linter = "0.8.3"
hadolint = "2.12.0"
helm-docs = "1.14.2"
kyverno = "1.18.2"
pluto = "5.24.1"
promtool = "3.13.1"
yq = "4.53.3"

# Local Testing & Mocking
k3d = "5.6.3"
act = "0.2.62"

# Runtimes / Programming Languages
node = "20.12.2"
python = "3.14.6"
go = "1.26.4"

# CLI Utilities
fzf = "0.73.1"
jq = "1.8.1"
bat = "0.26.1"
fd = "10.4.2"