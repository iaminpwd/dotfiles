---
- name: 인프라 엔지니어 로컬 환경 셋업 (Dotfiles)
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  # 사용자 HOME 아래 toolchain PATH를 play 전역에 주입하지 않는다.
  # play-level environment는 become:true 태스크에도 상속되므로, user-writable 경로를
  # 전역 PATH 앞에 두면 privileged shell/command가 동명 바이너리에 가로채질 수 있다.
  # mise PATH가 필요한 비권한 태스크는 각 role/task에서 국소적으로 선언한다.

  roles:
    - role: packages
      tags: ['packages', 'core']

    - role: docker
      tags: ['docker']
      # macOS(Darwin)도 진입은 허용 - 실제 설치는 Debian/RedHat에서만 하고,
      # Darwin에서는 롤 내부의 개별 태스크(when: Darwin)가 안내 메시지만 출력한다.
      when: ansible_os_family in ['Debian', 'RedHat', 'Darwin']

    - role: zsh
      tags: ['zsh', 'shell']

    - role: tflint
      tags: ['tflint', 'terraform']

    - role: stow
      tags: ['stow', 'symlinks']

    - role: ai_agent
      tags: ['ai', 'rules']
