---
- name: 인프라 엔지니어 로컬 환경 셋업 (Dotfiles)
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  # 환경 변수를 통해 mise 등의 경로를 보장
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"

  roles:
    - role: packages
      tags: ['packages', 'core']

    - role: docker
      tags: ['docker']
      # macOS(Darwin)도 진입은 허용 - 실제 설치는 Debian/RedHat에서만 하고,
      # Darwin에서는 롤 내부의 개별 태스크(when: Darwin)가 안내 메시지만 출력한다.
      when: ansible_os_family in ['Debian', 'RedHat', 'Darwin']

    - role: zsh
      tags: ['zsh', 'shell']

    - role: tflint
      tags: ['tflint', 'terraform']

    - role: stow
      tags: ['stow', 'symlinks']

    - role: ai_agent
      tags: ['ai', 'rules']
