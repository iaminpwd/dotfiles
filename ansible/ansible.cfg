[defaults]
# 1. 실행 결과 가독성 최적화 (JSON -> YAML 포맷으로 에러/로그 출력)
# `stdout_callback = yaml`(community.general.yaml)을 쓰지 않는다. 그 플러그인은
# ansible-core 2.13 의 result_format 옵션으로 대체되며 deprecated 됐고,
# community.general 12.0.0 에서 실제로 제거됐다. ansible 12.x 는 community.general
# 11.x 를 묶어 와서 아직 동작하지만, ansible 14.x(= community.general 12.x)로
# 올라가는 순간 "callback plugin has been removed" 로 태스크가 하나도 돌기 전에
# `just setup` 자체가 죽는다(실측: Renovate PR #6 의 bootstrap-smoke debian/macos 양쪽).
# 아래 조합은 ansible-core 2.13+ 전부에서 동일한 YAML 출력을 내므로 상하위 호환된다.
# [주의] ini 키는 `result_format` 이 아니라 `callback_result_format` 이다. ansible 이
# 띄우는 제거 안내 문구는 플러그인 "옵션명"(result_format)만 알려주는데, 그걸 그대로
# 적으면 ansible 이 모르는 키로 조용히 무시하고 출력이 JSON 으로 되돌아간다(실측).
stdout_callback = ansible.builtin.default
callback_result_format = yaml
bin_ansible_callbacks = True

# 2. 파이썬 인터프리터 경고(Warning) 억제
interpreter_python = auto_silent

# 3. 불필요한 로그 노이즈(Skipping, Deprecation) 억제
display_skipped_hosts = False
deprecation_warnings = False

# 4. 성능 최적화
# .retry 파일이 레포 루트에 생성되지 않도록 비활성화
retry_files_enabled = False
# facts 캐싱: 동일 플레이북 내 중복 gather_facts 실행 방지
gathering = smart
