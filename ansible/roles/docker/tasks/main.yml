---
- name: Docker 공식 저장소 지원 배포판 검증 (Ubuntu/Debian 외 Debian 계열 방지)
  ansible.builtin.assert:
    that:
      - ansible_distribution in ['Ubuntu', 'Debian']
    fail_msg: "Docker 공식 apt 저장소는 Ubuntu/Debian만 지원합니다. 감지된 배포판: {{ ansible_distribution }}"
  when: ansible_os_family == "Debian"

- name: Docker 필수 패키지 설치
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Docker GPG 키 다운로드 디렉토리 확보
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when: ansible_os_family == "Debian"

- name: Docker 공식 GPG 키 추가
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: true
  when: ansible_os_family == "Debian"

# 예전엔 `기대 지문이 stdout 에 포함되는가`(부분 문자열)로만 봤다. 그러면 키링에 기대
# 키가 들어 있기만 하면 통과하므로, 기대 키 "와 함께" 다른 키가 섞여 들어와도 그대로
# 승인된다 — 그리고 apt 는 signed-by 로 지정된 이 파일의 모든 키를 신뢰한다(실측: 신뢰
# 키 + 공격자 키를 함께 export 한 키링이 통과). 지문을 하드코딩한 의미가 사라지는 지점이다.
#
# bootstrap.sh 의 mise 검증이 쓰는 "첫 fpr 과 정확히 일치" 방식도 같은 이유로 부족하다
# (실측: 두 키를 합친 키링에서도 첫 fpr 은 여전히 신뢰 키라 통과). 주 키(pub 레코드 바로
# 뒤의 fpr) 만 뽑아 "정확히 1개이고 그것이 기대값" 인지를 본다 — 서브키 fpr 은 제외한다.
- name: Docker GPG 키 지문 검증 (공급망 보안)
  ansible.builtin.shell: |
    set -euo pipefail
    gpg --show-keys --with-colons /etc/apt/keyrings/docker.asc |
      awk -F: '/^pub:/ { want = 1; next } /^fpr:/ { if (want) { print $10; want = 0 } }'
  args:
    executable: /bin/bash
  register: docker_gpg_check
  become: true
  when: ansible_os_family == "Debian"
  changed_when: false
  failed_when: docker_gpg_check.stdout_lines != ['9DC858229FC7DD38854AE2D88D81803C0EBFCD88']

- name: Docker apt 레포지토리 추가
  ansible.builtin.apt_repository:
    repo: >
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Docker 엔진 패키지 설치
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    # update_cache는 packages role에서 cache_valid_time과 함께 처리하므로 생략
  become: true
  when: ansible_os_family == "Debian"

- name: Docker 그룹 선제 확보 (멱등성 보장)
  ansible.builtin.group:
    name: docker
    state: present
  become: true
  when: ansible_os_family in ["Debian", "RedHat"]

- name: 사용자를 docker 그룹에 추가 (Debian)
  ansible.builtin.user:
    # ansible_env.USER는 셸 환경변수 USER가 export 안 된 환경(컨테이너 docker exec,
    # PAM 로그인 세션 없는 su 등)에서 키 자체가 없어 fatal error를 낸다(실제 재현됨:
    # "object of type 'dict' has no attribute 'USER'"). ansible_user_id는 OS 사용자
    # 정보에서 직접 오는 내장 팩트라 이런 환경 의존성이 없다.
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  become: true
  when: ansible_os_family == "Debian"

- name: Docker 공식 저장소 지원 배포판 검증 (RHEL 계열)
  ansible.builtin.assert:
    that:
      - ansible_distribution in ['Fedora', 'CentOS', 'RedHat', 'Rocky', 'AlmaLinux', 'OracleLinux']
    fail_msg: "Docker 공식 yum 저장소는 Fedora/CentOS/RHEL/Rocky/AlmaLinux/OracleLinux만 지원합니다. 감지된 배포판: {{ ansible_distribution }}"
  when: ansible_os_family == "RedHat"

- name: Docker 저장소 추가 (RHEL)
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: "https://download.docker.com/linux/{{ 'fedora' if ansible_distribution == 'Fedora' else 'centos' }}/$releasever/$basearch/stable"
    enabled: true
    gpgcheck: true
    gpgkey: "https://download.docker.com/linux/{{ 'fedora' if ansible_distribution == 'Fedora' else 'centos' }}/gpg"
  become: true
  when: ansible_os_family == "RedHat"

- name: Docker 엔진 패키지 설치 (RHEL)
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    allowerasing: true
  become: true
  when: ansible_os_family == "RedHat"

- name: 사용자를 docker 그룹에 추가 (RHEL)
  ansible.builtin.user:
    # ansible_env.USER 대신 ansible_user_id를 쓰는 이유는 위 Debian 태스크 주석 참고.
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  become: true
  when: ansible_os_family == "RedHat"

- name: Docker 데몬 활성화 및 시작
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true
  when: ansible_os_family in ["Debian", "RedHat"]

# macOS는 리눅스 네이티브 데몬을 못 써서 Docker Desktop(또는 Colima/OrbStack) 같은
# VM 기반 런타임이 별도로 필요함 - 위 apt/dnf 태스크들과 달리 자동 설치 대상이 아니므로
# 안내만 출력한다 (README의 "macOS는 Docker Desktop 설치 안내"와 실제 동작을 일치시킴).
- name: Docker Desktop 수동 설치 안내 (macOS)
  ansible.builtin.debug:
    msg: >-
      macOS는 Docker Engine을 네이티브로 설치할 수 없습니다.
      https://www.docker.com/products/docker-desktop 에서 Docker Desktop을
      직접 설치하거나, Colima/OrbStack 같은 경량 대안을 사용하십시오.
  when: ansible_os_family == "Darwin"
