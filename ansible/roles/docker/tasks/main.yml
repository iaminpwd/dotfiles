---
- name: Docker 필수 패키지 설치
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Docker GPG 키 다운로드 디렉토리 확보
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when: ansible_os_family == "Debian"

- name: Docker 공식 GPG 키 추가
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: true
  when: ansible_os_family == "Debian"

- name: Docker GPG 키 지문 검증 (공급망 보안)
  ansible.builtin.command: gpg --show-keys --with-colons /etc/apt/keyrings/docker.asc
  register: docker_gpg_check
  become: true
  when: ansible_os_family == "Debian"
  changed_when: false
  failed_when: "'9DC858229FC7DD38854AE2D88D81803C0EBFCD88' not in docker_gpg_check.stdout"

- name: Docker apt 레포지토리 추가
  ansible.builtin.apt_repository:
    repo: >
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Docker 엔진 패키지 설치
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    # update_cache는 packages role에서 cache_valid_time과 함께 처리하므로 생략
  become: true
  when: ansible_os_family == "Debian"

- name: Docker 그룹 선제 확보 (멱등성 보장)
  ansible.builtin.group:
    name: docker
    state: present
  become: true
  when: ansible_os_family in ["Debian", "RedHat"]

- name: 사용자를 docker 그룹에 추가 (Debian)
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    groups: docker
    append: true
  become: true
  when: ansible_os_family == "Debian"

- name: Docker 저장소 추가 (RHEL)
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    enabled: true
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/centos/gpg
  become: true
  when: ansible_os_family == "RedHat"

- name: Docker 엔진 패키지 설치 (RHEL)
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true
  when: ansible_os_family == "RedHat"

- name: 사용자를 docker 그룹에 추가 (RHEL)
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    groups: docker
    append: true
  become: true
  when: ansible_os_family == "RedHat"

- name: Docker 데몬 활성화 및 시작
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true
  when: ansible_os_family in ["Debian", "RedHat"]
