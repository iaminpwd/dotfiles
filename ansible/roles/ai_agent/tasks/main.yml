---
- name: Gemini 글로벌 룰셋 환경 생성
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.gemini/config/skills"
    state: directory
    recurse: true

# force: true는 목적지에 이미 있는 게 무엇이든 조용히 덮어쓴다. 실제 파일이 있으면
# 미리 백업해 둔다 (bin/utils/safe-link-backup.sh 참고).
- name: Gemini 글로벌 AGENTS.md 목적지 충돌 백업
  ansible.builtin.command:
    cmd: /bin/bash "{{ role_path }}/../../../bin/utils/safe-link-backup.sh" "{{ ansible_env.HOME }}/.gemini/config/AGENTS.md"
  changed_when: false

- name: Gemini 글로벌 AGENTS.md 링크 설정
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../contexts/base.AGENTS.md"
    dest: "{{ ansible_env.HOME }}/.gemini/config/AGENTS.md"
    state: link
    force: true

- name: Claude 글로벌 룰셋 환경 생성
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.claude/skills"
    state: directory
    recurse: true

- name: Claude 글로벌 CLAUDE.md 목적지 충돌 백업
  ansible.builtin.command:
    cmd: /bin/bash "{{ role_path }}/../../../bin/utils/safe-link-backup.sh" "{{ ansible_env.HOME }}/.claude/CLAUDE.md"
  changed_when: false

- name: Claude 글로벌 CLAUDE.md 링크 설정
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../contexts/base.AGENTS.md"
    dest: "{{ ansible_env.HOME }}/.claude/CLAUDE.md"
    state: link
    force: true

- name: Codex 글로벌 룰셋 환경 생성
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.codex"
    state: directory
    recurse: true

- name: Codex 글로벌 AGENTS.md 목적지 충돌 백업
  ansible.builtin.command:
    cmd: /bin/bash "{{ role_path }}/../../../bin/utils/safe-link-backup.sh" "{{ ansible_env.HOME }}/.codex/AGENTS.md"
  changed_when: false

- name: Codex 글로벌 AGENTS.md 링크 설정
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../contexts/base.AGENTS.md"
    dest: "{{ ansible_env.HOME }}/.codex/AGENTS.md"
    state: link
    force: true

- name: 워크스페이스 디렉토리 생성
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/workspace"
    state: directory
    mode: '0755'

# 예전 ai_agent 롤은 실행 가능한 bin/ 및 contexts/*/scripts 파일을 ~/.local/bin에
# basename으로 평탄화했다. 현재는 bin 도구를 ~/dotfiles 정본 경로로 직접 호출하고,
# context scripts는 각 에이전트의 Skill assets로 별도 등록하므로 global PATH 링크가
# 중복이다. 공유 ~/.local/bin의 외부 파일/링크는 건드리지 않고 과거 dotfiles 소유
# 링크만 마이그레이션 정리한다.
- name: 레거시 에이전트 스크립트 global 링크 정리
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ role_path }}/../../../bin/utils/prune-orphan-agent-scripts.sh"
      - "{{ role_path }}/../../.."
      - "{{ ansible_env.HOME }}/.local/bin"
  register: ai_agent_script_prune_result
  changed_when: "'[PRUNED]' in ai_agent_script_prune_result.stdout"

- name: 컨텍스트 도메인 디렉토리 목록 조회
  ansible.builtin.find:
    paths: "{{ role_path }}/../../../contexts"
    file_type: directory
    recurse: false
  register: ai_agent_context_domains

- name: Gemini / Claude / Codex 글로벌 스킬 등록 디렉토리 생성
  ansible.builtin.file:
    path: "{{ item[0] }}/skills/{{ item[1].path | basename }}"
    state: directory
    mode: '0755'
  loop: >-
    {{ [ansible_env.HOME + '/.gemini/config', ansible_env.HOME + '/.claude', ansible_env.HOME + '/.agents']
       | product(ai_agent_context_domains.files) | list }}
  loop_control:
    label: "{{ item[0] | basename }}/skills/{{ item[1].path | basename }}"
  when: >
    item[1].path | basename not in ['dotfiles']

- name: Gemini / Claude / Codex 스킬 파일 및 폴더 링크 생성 대상 정의
  ansible.builtin.set_fact:
    ai_agent_skill_link_targets:
      - SKILL.md
      - references
      - scripts
      - examples

- name: 스킬 구성요소 존재 여부 확인
  ansible.builtin.stat:
    path: "{{ item[0].path }}/{{ item[1] }}"
  register: ai_agent_skill_assets_stat
  loop: "{{ ai_agent_context_domains.files | product(ai_agent_skill_link_targets) | list }}"
  loop_control:
    label: "{{ item[0].path | basename }}/{{ item[1] }}"

# 링크가 이미 정상이어도 에셋별 Ansible 모듈을 실행하지 않도록 백업 확인을 합친다.
- name: Gemini / Claude / Codex 스킬 에셋 목적지 일괄 충돌 백업
  ansible.builtin.command:
    expand_argument_vars: false
    argv: >-
      {%- set targets = [] -%}
      {%- for asset in ai_agent_skill_assets_stat.results -%}
      {%- if asset.stat.exists and asset.item[0].path | basename != 'dotfiles' -%}
      {%- for client in ['.gemini/config', '.claude', '.agents'] -%}
      {%- set _ = targets.append(ansible_env.HOME + '/' + client + '/skills/' +
                                (asset.item[0].path | basename) + '/' + asset.item[1]) -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ['/bin/bash', role_path + '/../../../bin/utils/safe-link-backup.sh'] + targets }}
  changed_when: false

- name: Gemini 글로벌 스킬 에셋 링크 설정
  ansible.builtin.file:
    src: "{{ item.item[0].path }}/{{ item.item[1] }}"
    dest: "{{ ansible_env.HOME }}/.gemini/config/skills/{{ item.item[0].path | basename }}/{{ item.item[1] }}"
    state: link
    force: true
  loop: "{{ ai_agent_skill_assets_stat.results }}"
  loop_control:
    label: ".gemini/config/skills/{{ item.item[0].path | basename }}/{{ item.item[1] }}"
  when: >
    item.stat.exists and
    item.item[0].path | basename not in ['dotfiles']

- name: Claude 글로벌 스킬 에셋 링크 설정
  ansible.builtin.file:
    src: "{{ item.item[0].path }}/{{ item.item[1] }}"
    dest: "{{ ansible_env.HOME }}/.claude/skills/{{ item.item[0].path | basename }}/{{ item.item[1] }}"
    state: link
    force: true
  loop: "{{ ai_agent_skill_assets_stat.results }}"
  loop_control:
    label: ".claude/skills/{{ item.item[0].path | basename }}/{{ item.item[1] }}"
  when: >
    item.stat.exists and
    item.item[0].path | basename not in ['dotfiles']

- name: Codex 글로벌 스킬 에셋 링크 설정
  ansible.builtin.file:
    src: "{{ item.item[0].path }}/{{ item.item[1] }}"
    dest: "{{ ansible_env.HOME }}/.agents/skills/{{ item.item[0].path | basename }}/{{ item.item[1] }}"
    state: link
    force: true
  loop: "{{ ai_agent_skill_assets_stat.results }}"
  loop_control:
    label: ".agents/skills/{{ item.item[0].path | basename }}/{{ item.item[1] }}"
  when: >
    item.stat.exists and
    item.item[0].path | basename not in ['dotfiles']

- name: Gemini 및 Claude 편집 이력 훅(agent-edits-hook) 병합
  ansible.builtin.command:
    cmd: /bin/bash "{{ role_path }}/../../../bin/utils/merge-agent-hooks.sh" "{{ role_path }}/../../../ansible"
  register: ai_agent_hooks_merge_result
  changed_when: "'[CHANGED]' in ai_agent_hooks_merge_result.stdout"

# 폴더 전체가 심볼릭 링크로만 구성된(=이 롤이 만든) 경우에만 삭제한다. 사용자가 직접
# 만들었거나 다른 도구로 설치해 실제 파일이 섞여 있는 폴더는 이름이 우연히 contexts/
# 도메인 목록에 없어도 건드리지 않는다 (bin/utils/prune-orphan-skills.sh 참고).
- name: 고아(Orphan) 스킬 폴더 정리 (소유권 검증 후 삭제)
  ansible.builtin.command:
    cmd: >-
      /bin/bash "{{ role_path }}/../../../bin/utils/prune-orphan-skills.sh"
      "{{ item }}"
      {{ (ai_agent_context_domains.files | map(attribute='path') | map('basename') | list) | join(' ') }}
  loop:
    - "{{ ansible_env.HOME }}/.gemini/config/skills"
    - "{{ ansible_env.HOME }}/.claude/skills"
    - "{{ ansible_env.HOME }}/.agents/skills"
  # register 이름을 changed_when 에서 참조하는 것이 loop 태스크의 정상 관용구다. Ansible 은
  # 각 아이템 실행 직후 그 아이템의 결과를 이 이름으로 바인딩하므로 아이템별로 정확히
  # 갈린다(실측, ansible-core 2.19.11: [PRUNED] 아이템 changed=true / [SKIP] 아이템 false).
  # 반대로 bare `stdout` 을 쓰면 "'stdout' is undefined" 로 태스크가 실패한다 — 조건식에
  # 결과 필드를 자동 주입하던 옛 동작은 제거됐다.
  changed_when: "'[PRUNED]' in ai_agent_prune_result.stdout"
  register: ai_agent_prune_result

- name: Dotfiles 로컬 룰셋 심볼릭 링크 생성
  ansible.builtin.file:
    src: "{{ role_path }}/../../../contexts/dotfiles/SKILL.md"
    dest: "{{ role_path }}/../../../{{ item }}"
    state: link
    force: true
  loop:
    - AGENTS.md
    - CLAUDE.md
