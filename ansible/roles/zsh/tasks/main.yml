---
# 아래 세 클론은 네트워크에 의존하는 유일한 태스크다. GitHub Actions 러너에서 앞의 두
# 클론은 성공하고 세 번째만 "server certificate verification failed. CAfile: none" 으로
# 죽는 일과성 TLS 실패가 실측됐다(CI run 31546834372). CA 저장소가 실제로 없었다면 앞의
# 두 개도 같이 실패했을 것이므로 환경 결함이 아니라 순간적인 실패이고, 셋업 전체가
# 그 한 번에 무너지지 않도록 짧은 간격의 재시도를 둔다. update: false 라 이미 받아둔
# 저장소에 대해서는 재시도해도 no-op 이므로 멱등성에 영향이 없다.
- name: Oh My Zsh 저장소 클론 (unattended)
  ansible.builtin.git:
    repo: 'https://github.com/ohmyzsh/ohmyzsh.git'
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh"
    depth: 1
    version: 7ea697fd8138550ddf7262456d412f0dcd1cbf84
    update: false
  register: zsh_clone_result
  until: zsh_clone_result is succeeded
  retries: 3
  delay: 5

- name: Zsh-autosuggestions 플러그인 클론
  ansible.builtin.git:
    repo: 'https://github.com/zsh-users/zsh-autosuggestions.git'
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    depth: 1
    version: v0.7.1
    update: false
  register: zsh_clone_result
  until: zsh_clone_result is succeeded
  retries: 3
  delay: 5

- name: Zsh-syntax-highlighting 플러그인 클론
  ansible.builtin.git:
    repo: 'https://github.com/zsh-users/zsh-syntax-highlighting.git'
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
    depth: 1
    version: 0.8.0
    update: false
  register: zsh_clone_result
  until: zsh_clone_result is succeeded
  retries: 3
  delay: 5

- name: 현재 설치된 zsh 경로 확인
  ansible.builtin.command: which zsh
  register: zsh_path
  changed_when: false
  failed_when: false

- name: 확인된 zsh 경로를 /etc/shells에 등록
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ zsh_path.stdout }}"
    state: present
  become: true
  when: zsh_path.stdout != ""

- name: 사용자의 기본 셸을 zsh로 변경
  ansible.builtin.user:
    # ansible_env.USER는 셸 환경변수 USER가 export 안 된 환경(컨테이너 docker exec,
    # PAM 로그인 세션 없는 su 등)에서 키 자체가 없어 fatal error를 낸다(실제 재현됨,
    # ansible/roles/docker/tasks/main.yml 주석 참고). ansible_user_id로 대체.
    name: "{{ ansible_user_id }}"
    shell: "{{ zsh_path.stdout }}"
  become: true
  when:
    - zsh_path.stdout is defined
    - zsh_path.stdout != ""
  failed_when: false # 루트 권한이 없는 비권한(non-root) 실행 환경을 위한 안전 가드
