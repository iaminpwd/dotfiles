---
- name: OS 패키지 설치 (Debian 계열)
  ansible.builtin.apt:
    name:
      - git
      - curl
      - unzip
      - wget
      - zsh
      - stow
      - tree
      - ca-certificates
      - gnupg
      - dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600 # 1시간 이내 재실행 시 apt update 스킵
  become: true
  when: ansible_os_family == "Debian"

- name: OS 패키지 설치 (RedHat 계열)
  ansible.builtin.dnf:
    name:
      - git
      - curl
      - unzip
      - wget
      - zsh
      - stow
      - tree
      - ca-certificates
      - gnupg2
      - bind-utils
    state: present
  become: true
  when: ansible_os_family == "RedHat"

- name: OS 패키지 설치 (macOS Homebrew)
  community.general.homebrew:
    name:
      - git
      - curl
      - unzip
      - wget
      - zsh
      - stow
      - tree
      - bash
      - coreutils
      - gnu-sed
      - findutils
      - grep
    state: present
  when: ansible_os_family == "Darwin"
