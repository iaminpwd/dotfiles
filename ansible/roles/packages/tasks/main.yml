---
- name: OS 패키지 설치 (Debian 계열)
  ansible.builtin.apt:
    name:
      - git
      - curl
      - unzip
      - wget
      - zsh
      - stow
      - tree
      - ca-certificates
      - gnupg
      - dnsutils
      - gawk
    state: present
    update_cache: true
    cache_valid_time: 3600 # 1시간 이내 재실행 시 apt update 스킵
  become: true
  when: ansible_os_family == "Debian"

- name: EPEL 저장소 활성화 (RHEL/Rocky/CentOS)
  ansible.builtin.dnf:
    # stock RHEL 기본 저장소에는 epel-release가 없을 수 있으므로 Fedora가 배포하는
    # 메이저 버전별 release RPM을 직접 설치한다. RHEL 호환 배포판도 같은 EPEL X를 사용한다.
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
  become: true
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution != "Fedora"

- name: OS 패키지 설치 (RedHat 계열)
  ansible.builtin.dnf:
    name:
      - git
      - curl
      - unzip
      - wget
      - zsh
      - stow
      - tree
      - ca-certificates
      - gnupg2
      - bind-utils
      - gawk
    state: present
  become: true
  when: ansible_os_family == "RedHat"

- name: OS 패키지 설치 (macOS Homebrew)
  community.general.homebrew:
    name:
      - git
      - curl
      - unzip
      - wget
      - zsh
      - stow
      - tree
      - bash
      - coreutils
      - gnu-sed
      - findutils
      - grep
    state: present
  when: ansible_os_family == "Darwin"
