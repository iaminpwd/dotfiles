---
- name: 기존 파일 백업 (stow 충돌 방지)
  ansible.builtin.command:
    cmd: >-
      /bin/bash "{{ role_path }}/../../../bin/utils/stow-backup.sh"
      "{{ stow_package.path | basename }}"
      "{{ role_path }}/../../../stow/"
      "{{ ansible_env.HOME }}"
  changed_when: false

# 설치기와 같은 GNU Stow ignore 필터·소스 검증·no-follow HOME 탐색을 이용한다.
# Stow verbose 출력에 의존하거나 별도의 쉘 파일 목록/링크 판정을 유지하지 않는다.
- name: 심볼릭 링크 드리프트(변경 필요 여부) 사전 판정
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../../../bin/utils/stow-safe-install.py"
      - --check-drift
      - "{{ role_path }}/../../../stow"
      - "{{ stow_package.path | basename }}"
      - "{{ ansible_env.HOME }}"
  register: stow_drift_check
  changed_when: false
  # 상태를 전혀 바꾸지 않는 읽기 전용 판정이라 --check(dry-run)에서도 그대로 실행한다.
  # command/shell 모듈은 check 모드에서 기본적으로 건너뛰는데, 그러면 이 판정이 스킵되고
  # stow_drift_check.results 가 비어 아래 stow 태스크까지 통째로 스킵돼, `just setup-dryrun`
  # 이 stow 롤에 대해 아무것도 판정하지 않은 채 "변경 없음"처럼 보였다
  # (실측: --tags stow --check → ok=4 skipped=4).
  check_mode: false

# --no-folding 필수: 대상 디렉토리(예: ~/.config/mise)를 미리 만들어 둬도 비어 있으면
# GNU Stow가 그 부모(~/.config)까지 통째로 하나의 심볼릭 링크로 접어버린다(실측
# 재현됨). 그러면 이후 다른 프로그램이 ~/.config/<자기이름>/에 쓰는 실제 설정·시크릿이
# 전부 그 링크를 타고 이 저장소 디렉토리 안으로 흘러들어간다(실측: gh/infracost 인증
# 정보가 유출된 사고). --no-folding으로 항상 리프 파일 단위로만 링크해 부모 디렉토리는
# 실제 디렉토리로 남긴다.
# GNU Stow's Perl ignore matcher still determines the managed file inventory,
# but pathname-based GNU Stow symlink()/mkdir() can follow a swapped HOME parent
# after its preflight. The installer pins every parent via O_NOFOLLOW dirfds.
# It never unlinks or overwrites an existing user entry.
- name: 안전한 파일 단위 심볼릭 링크 적용 (GNU Stow ignore 규칙 준수)
  ansible.builtin.command:
    cmd: >-
      python3 "{{ role_path }}/../../../bin/utils/stow-safe-install.py"
      "{{ role_path }}/../../../stow"
      "{{ stow_package.path | basename }}"
      "{{ ansible_env.HOME }}"
  # Running on an already clean package would report changed without mutation.
  when:
    - not ansible_check_mode
    - stow_drift_check.stdout is defined
    - stow_drift_check.stdout | trim == '1'
  changed_when: "stow_drift_check.stdout is defined and stow_drift_check.stdout | trim == '1'"

# 위 stow 태스크는 실제로 상태를 바꾸므로 check 모드에서는 계속 스킵된다. 그러면 dry-run
# 사용자가 "무엇이 재링크될 예정인가"를 알 수 없으므로, 위 드리프트 판정 결과를 근거로
# 대상 패키지 목록만 따로 출력한다.
- name: 재링크 예정 stow 패키지 안내 (dry-run 전용)
  ansible.builtin.debug:
    msg: >-
      {{ stow_package.path | basename }}:
      {{ '재링크 예정' if (stow_drift_check.stdout | default('0') | trim == '1') else '드리프트 없음' }}
  when: ansible_check_mode
