---
# Before the ordinary Stow package loop, HOME setup must use the same
# no-follow directory-fd boundary as the safe link installer. Separate
# Ansible stat/assert/file tasks leave a writable TOCTOU interval:
# ~/.config can be swapped after assertion, and ~/.mise.toml can become a
# foreign user file after its identity was checked but before deletion.
- name: Mise 설정 경로 안전 생성 (디렉토리 FD 기반)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../../../bin/utils/stow-safe-role-init.py"
      - mise
      - "{{ ansible_env.HOME }}"
      - "{{ role_path }}/../../.."
      - "{{ '--check' if ansible_check_mode else '--apply' }}"
  register: stow_mise_init_result
  changed_when: "stow_mise_init_result.stdout.startswith('CHANGED:')"
  # Explicit --check is read-only. Run the guard even in Ansible check mode.
  check_mode: false

# Removing a previously checked path with state: absent can delete a new
# user file that arrived since the stat task. Move to a private stage and
# verify the moved inode before deleting only the historic Stow-owned link.
- name: 구버전 Mise 링크의 안전한 정리 (경합 시 원본 보존)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../../../bin/utils/stow-safe-role-init.py"
      - legacy
      - "{{ ansible_env.HOME }}"
      - "{{ role_path }}/../../.."
      - "{{ '--check' if ansible_check_mode else '--apply' }}"
  register: stow_legacy_init_result
  changed_when: "stow_legacy_init_result.stdout.startswith('CHANGED:')"
  check_mode: false

- name: Dotfiles 하위의 stow 대상 디렉토리 목록 스캔
  ansible.builtin.find:
    paths: "{{ role_path }}/../../../stow/"
    file_type: directory
    recurse: false
  register: stow_dirs

# Back up one package, check drift, and apply it before starting the next.
# If Stow fails, never preemptively move unrelated packages' user files.
- name: Stow 패키지별 백업·드리프트 판정·적용
  ansible.builtin.include_tasks: package.yml
  loop: "{{ stow_dirs.files }}"
  loop_control:
    loop_var: stow_package
    label: "{{ stow_package.path | basename }}"
