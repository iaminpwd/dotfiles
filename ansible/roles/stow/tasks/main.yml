---
- name: Local 전용 오버라이드 폴더 확보
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/mise"
    state: directory
    mode: "0755"

- name: 구버전 ~/.mise.toml 심볼릭 링크 정리
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.mise.toml"
    state: absent

- name: Dotfiles 하위의 stow 대상 디렉토리 목록 스캔
  ansible.builtin.find:
    paths: "{{ role_path }}/../../../"
    file_type: directory
    recurse: false
    excludes:
      - "contexts"
      - "assets"
      - "ansible"
      - "bin"
      - "mise"
      - "tflint"
      - ".*"
  register: stow_dirs

- name: 기존 파일 백업 (stow 충돌 방지)
  ansible.builtin.command:
    cmd: /bin/bash "{{ role_path }}/../../../bin/utils/stow-backup.sh" "{{ item.path | basename }}" "{{ role_path }}/../../../" "{{ ansible_env.HOME }}"
  loop: "{{ stow_dirs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  changed_when: false

- name: GNU Stow 를 통해 홈 디렉토리에 심볼릭 링크 적용
  ansible.builtin.command:
    cmd: stow -t {{ ansible_env.HOME }} -R --verbose {{ item.path | basename }}
    chdir: "{{ role_path }}/../../../"
  loop: "{{ stow_dirs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: stow_result
  changed_when: "'LINK:' in stow_result.stdout or 'UNLINK:' in stow_result.stdout"
