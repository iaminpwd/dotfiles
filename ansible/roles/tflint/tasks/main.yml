---
- name: Tflint 실행 가능 여부 확인
  ansible.builtin.command: which tflint
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"
  register: tflint_check
  failed_when: false
  changed_when: false

- name: Tflint 플러그인 설정 및 다운로드 갱신
  when: tflint_check.rc == 0
  block:
    - name: Tflint 저장소 디렉토리 생성
      ansible.builtin.file:
        path: "{{ role_path }}/../../../stow/tflint"
        state: directory
        mode: '0755'

    # TFLint 0.64.0은 플러그인 추출 시 최종 파일을 먼저 O_TRUNC로 연 뒤 내용을 쓴다.
    # 그 사이 프로세스가 중단되면 0바이트 파일이 남을 수 있고, 다음 --init은 파일 존재만
    # 확인해 "이미 설치됨"으로 처리한다. 유효한 플러그인일 수 없는 빈 바이너리만 제거해
    # 기존 --init이 같은 고정 버전을 다시 검증·다운로드하도록 한다.
    - name: Tflint 플러그인 디렉토리 상태 확인
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.tflint.d/plugins"
      register: tflint_plugin_dir
      changed_when: false

    - name: Tflint 플러그인 파일 탐지
      ansible.builtin.find:
        paths: "{{ ansible_env.HOME }}/.tflint.d/plugins"
        patterns: 'tflint-ruleset-*'
        file_type: file
        recurse: true
      register: tflint_plugin_files
      changed_when: false
      when: tflint_plugin_dir.stat.isdir | default(false)

    - name: 중단 설치로 남은 빈 Tflint 플러그인 제거
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ tflint_plugin_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when: item.size | int == 0

    - name: Tflint 플러그인 초기화 및 다운로드 (--init)
      ansible.builtin.command: tflint --init --config "{{ role_path }}/../../../stow/tflint/.tflint.hcl"
      environment:
        PATH: "{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"
      register: tflint_init_result
      until: tflint_init_result is succeeded
      retries: 3
      delay: 5
      changed_when: "'Installing' in tflint_init_result.stdout"
